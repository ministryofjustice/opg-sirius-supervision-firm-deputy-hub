services:
  firm-deputy-hub:
    image: 311462405659.dkr.ecr.eu-west-1.amazonaws.com/sirius/sirius-firm-deputy-hub:latest
    build:
      dockerfile: docker/sirius-firm-deputy-hub/Dockerfile
    ports:
      - "8888:8888"
    privileged: false
    user: app
    read_only: true
    environment:
      HEALTHCHECK: /supervision/deputies/firm/health-check
      PORT: 8888
      SIRIUS_URL: http://json-server:3000
      PREFIX: /supervision/deputies/firm
    depends_on:
      - json-server

  json-server:
    build:
      dockerfile: docker/json-server/Dockerfile
    ports:
      - "3000:3000"

  cypress:
    build:
      dockerfile: docker/cypress/Dockerfile
    command: [ "--headless", "-b", "chrome" ]
    volumes:
      - ./cypress/screenshots:/root/cypress/screenshots:rw,delegated
      - ./cypress/logs:/root/cypress/logs:rw,delegated
    depends_on:
      - firm-deputy-hub

  test-runner:
    build:
      context: docker/test-runner/
    working_dir: /go/src/app
    volumes:
      - ./:/go/src/app
      - ./.gocache:/go/pkg/mod

  go-lint:
    image: golangci/golangci-lint:v2.14.0@sha256:ad862ba6b3798cbe0fd9fd7408d498fd74fbd2623a92406b2fd3898faf0bf98f
    working_dir: /go/src/app
    volumes:
      - ./:/go/src/app
      - ./.cache/golangci-lint/v2.2.1:/root/.cache
    command: golangci-lint run -v --timeout 5m

  gosec:
    image: securego/gosec:latest@sha256:2cf71ea78210c496c65e3a987576a9c8317b68e20f2960520b3f6f8f9f539be5
    working_dir: /app
    volumes:
      - .:/app
    command: -exclude-dir=.gocache -fmt=sarif -out=/app/test-results/gosec.sarif -stdout -verbose=text /app/...

  npm:
    build:
      dockerfile: docker/npm/Dockerfile
    command: ["ci", "--ignore-scripts"]
    volumes:
      - ./:/home/node/app

  pact-cli:
    image: pactfoundation/pact-cli:1.5.0.4
    working_dir: /go/src/app
    volumes:
      - ./pacts:/go/src/app/pacts